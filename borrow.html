<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大墩水藥室借用管理系統 - 風澤醫療體系</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --bg-main: #f7f4ef;
      --text-primary: #4a3b32;
      --text-muted: #7e6f65;
      --brand-brown: #6b5240;
      --brand-brown-hover: #543f30;
      --brand-sage: #5c7258;
      --brand-sage-hover: #485b45;
      --border-color: #e5dec9;
      --card-bg: #ffffff;
      --accent-light: #f3ede2;
      --badge-bg: #f4efe6;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 20px;
    }

    .brand-header {
      background-color: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px 24px;
      box-shadow: 0 2px 8px rgba(74, 59, 50, 0.05);
    }
    .brand-logo {
      height: 38px;
      object-fit: contain;
    }
    .header-divider {
      width: 1px;
      height: 24px;
      background-color: #c5b8a5;
    }
    .header-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: 0.5px;
    }

    .btn-home {
      background-color: #ffffff;
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      border-radius: 50rem;
      padding: 6px 16px;
      font-size: 0.9rem;
      font-weight: 600;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .btn-home:hover {
      background-color: var(--accent-light);
      color: var(--brand-brown);
      border-color: #d1c5b4;
    }
    .badge-brand {
      background-color: var(--badge-bg);
      color: var(--text-primary);
      border: 1px solid #e2d8c8;
      border-radius: 50rem;
      padding: 6px 16px;
      font-size: 0.88rem;
      font-weight: 500;
    }

    .main-container {
      background-color: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 12px rgba(74, 59, 50, 0.03);
    }
    .card {
      border: 1px solid var(--border-color);
      border-radius: 8px;
    }
    .card-header {
      background-color: var(--accent-light);
      border-bottom: 1px solid var(--border-color);
      color: var(--text-primary);
      font-weight: 600;
    }

    .nav-tabs {
      border-bottom: 2px solid var(--border-color);
    }
    .nav-tabs .nav-link {
      color: var(--text-muted);
      font-weight: 600;
      border: none;
      border-bottom: 3px solid transparent;
      border-radius: 0;
      padding: 10px 18px;
    }
    .nav-tabs .nav-link.active {
      color: var(--brand-brown);
      background-color: transparent;
      border-bottom: 3px solid var(--brand-brown);
    }

    .btn-brand-primary {
      background-color: var(--brand-sage);
      color: #ffffff;
      border: none;
    }
    .btn-brand-primary:hover {
      background-color: var(--brand-sage-hover);
      color: #ffffff;
    }
    .btn-outline-brand {
      color: var(--brand-brown);
      border-color: var(--brand-brown);
    }
    .btn-outline-brand:hover {
      background-color: var(--brand-brown);
      color: #ffffff;
    }

    .table-light-header th {
      background-color: var(--accent-light);
      color: var(--text-primary);
    }

    .preview-box {
      background-color: var(--accent-light);
      border-radius: 6px;
      padding: 15px;
    }
    #loadingSpinner { display: none; }
  </style>
</head>
<body>

  <header class="brand-header mb-4 d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-center gap-3">
      <img src="logo.png" alt="風澤醫療體系 LOGO" class="brand-logo">
      <div class="header-divider"></div>
      <h1 class="header-title mb-0">大墩水藥室借用管理系統</h1>
    </div>
    <div class="d-flex align-items-center gap-2">
      <a href="index.html" class="btn btn-home text-decoration-none">
        🏠 返回主控台
      </a>
      <span class="badge-brand">風澤醫療體系</span>
      <div id="loadingSpinner" class="spinner-border spinner-border-sm text-secondary ms-2" role="status">
        <span class="visually-hidden">載入中...</span>
      </div>
    </div>
  </header>

  <div class="main-container">
    <ul class="nav nav-tabs mb-4" id="mainTab" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="input-tab" data-bs-toggle="tab" data-bs-target="#input-pane" type="button" role="tab">✍️ 借用品項批次輸入</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="summary-tab" data-bs-toggle="tab" data-bs-target="#summary-pane" type="button" role="tab" onclick="calculateMonthlySummary()">📊 月度總量統計</button>
      </li>
    </ul>

    <div class="tab-content" id="mainTabContent">

      <!-- 頁籤一：輸入與歷史紀錄 -->
      <div class="tab-pane fade show active" id="input-pane" role="tabpanel">
        <div class="card mb-4">
          <div class="card-header d-flex justify-content-between align-items-center">
            <h5 class="m-0">借用品項輸入區</h5>
          </div>
          <div class="card-body">
            <form id="batchForm">
              <div class="row mb-3">
                <div class="col-md-12">
                  <label class="form-label fw-bold">借用日期</label>
                  <input type="date" id="batchDate" class="form-control" required>
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label fw-bold">文字批次輸入框 
                  <span class="fs-6 font-monospace" style="color: var(--brand-brown);">(格式：品項名稱 數量)</span>
                </label>
                <textarea id="bulkInputText" class="form-control font-monospace" rows="5" placeholder="例如：
仙梅粒大包 5
酸梅大包1斤 2
仙楂餅大包 10
牛皮紙袋(大) 100
牛皮紙袋(小) 50" oninput="parseBulkInput()"></textarea>
                <div class="form-text">提示：品項名稱與數量之間請用「空白」隔開即可（預設數量為 1）。</div>
              </div>

              <div id="previewArea" class="preview-box mb-3" style="display: none;">
                <h6 class="fw-bold mb-2" style="color: var(--brand-brown);">🔍 即時解析結果預覽：</h6>
                <div class="table-responsive">
                  <table class="table table-sm table-bordered bg-white mb-0">
                    <thead class="table-light-header">
                      <tr>
                        <th>品項名稱</th>
                        <th style="width: 120px;" class="text-center">數量</th>
                      </tr>
                    </thead>
                    <tbody id="previewTableBody"></tbody>
                  </table>
                </div>
              </div>

              <button type="submit" id="submitBtn" class="btn btn-brand-primary w-100 mt-2 py-2 fw-bold" disabled>一次性儲存至雲端試算表</button>
            </form>
          </div>
        </div>

        <div class="card">
          <div class="card-header d-flex justify-content-between align-items-center">
            <h5 class="m-0">雲端同步歷史紀錄</h5>
            <div>
              <button class="btn btn-sm btn-outline-brand me-2" onclick="fetchLogs()">🔄 重新整理資料</button>
              <button class="btn btn-sm btn-outline-success" onclick="exportToCSV()">匯出明細 CSV</button>
            </div>
          </div>
          <div class="card-body">
            <div class="table-responsive">
              <table class="table table-striped table-hover align-middle">
                <thead>
                  <tr>
                    <th>借用日期</th>
                    <th>品項名稱</th>
                    <th style="width: 120px;">數量</th>
                    <th style="width: 150px;" class="text-center">紀錄操作</th>
                  </tr>
                </thead>
                <tbody id="logTableBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

      <!-- 頁籤二：月度總量統計 -->
      <div class="tab-pane fade" id="summary-pane" role="tabpanel">
        <div class="card mb-4">
          <div class="card-body">
            <div class="row g-3 align-items-center">
              <div class="col-md-4">
                <label class="form-label fw-bold">選擇統計月份：</label>
                <input type="month" id="monthPicker" class="form-control" onchange="calculateMonthlySummary()">
              </div>
              <div class="col-md-5">
                <label class="form-label">搜尋品項名稱：</label>
                <input type="text" id="searchInput" class="form-control" placeholder="輸入品項名稱關鍵字..." oninput="renderSummaryTable()">
              </div>
              <div class="col-md-3 d-flex align-items-end">
                <button class="btn btn-brand-primary w-100" onclick="exportSummaryCSV()">匯出月報表</button>
              </div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-header d-flex justify-content-between align-items-center">
            <h5 class="m-0" id="summaryTitle">月度彙整結果</h5>
            <span class="badge badge-brand" id="totalSpeciesBadge">共 0 種品項</span>
          </div>
          <div class="card-body">
            <div class="table-responsive">
              <table class="table table-bordered table-hover align-middle">
                <thead class="table-light-header">
                  <tr>
                    <th style="width: 60px;" class="text-center">序號</th>
                    <th>品項名稱</th>
                    <th style="width: 160px;" class="text-center">月度總借用量</th>
                    <th style="width: 100px;" class="text-center">次數</th>
                  </tr>
                </thead>
                <tbody id="summaryTableBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwz3E-EO3dGsraL9NFGMU7sU13KaZCjrSNieWUWYEEGxYN9PiXSyaePES_qkJP0ENhzWQ/exec";

    let logs = [];          
    let monthlyMap = {};    
    let parsedItems = [];   

    document.addEventListener("DOMContentLoaded", () => {
      const now = new Date();
      document.getElementById('batchDate').value = now.toISOString().split('T')[0];
      
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      document.getElementById('monthPicker').value = `${year}-${month}`;

      fetchLogs();
    });

    function setLoading(isLoading) {
      document.getElementById('loadingSpinner').style.display = isLoading ? 'inline-block' : 'none';
    }

    function fetchLogs() {
      setLoading(true);
      fetch(GAS_URL)
        .then(res => res.json())
        .then(data => {
          logs = data;
          renderLogs();
          calculateMonthlySummary();
          setLoading(false);
        })
        .catch(err => {
          alert("無法讀取雲端資料，請檢查網路或 GAS 網址！");
          setLoading(false);
        });
    }

    function parseBulkInput() {
      const rawText = document.getElementById('bulkInputText').value;
      const lines = rawText.split('\n');
      const date = document.getElementById('batchDate').value;

      parsedItems = [];
      const previewTableBody = document.getElementById('previewTableBody');
      previewTableBody.innerHTML = '';

      lines.forEach(line => {
        let trimmed = line.trim();
        if (!trimmed) return;

        const parts = trimmed.split(/\s+/).filter(Boolean);
        if (parts.length === 0) return;

        const name = parts[0];
        let qty = 1;

        if (parts.length >= 2 && !isNaN(parts[1])) {
          qty = parts[1];
        }

        parsedItems.push({
          id: Date.now() + "_" + Math.floor(Math.random() * 10000),
          date: date,
          name: name,
          qty: qty
        });

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="fw-bold">${name}</td>
          <td class="text-center">${qty}</td>
        `;
        previewTableBody.appendChild(tr);
      });

      const previewArea = document.getElementById('previewArea');
      const submitBtn = document.getElementById('submitBtn');

      if (parsedItems.length > 0) {
        previewArea.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.innerText = `一次性儲存共 ${parsedItems.length} 項借用品項至雲端`;
      } else {
        previewArea.style.display = 'none';
        submitBtn.disabled = true;
        submitBtn.innerText = "一次性儲存至雲端試算表";
      }
    }

    document.getElementById('batchForm').addEventListener('submit', function(e) {
      e.preventDefault();
      if (parsedItems.length === 0) return;

      setLoading(true);

      fetch(GAS_URL, {
        method: "POST",
        body: JSON.stringify({ action: "add", items: parsedItems })
      })
      .then(res => res.json())
      .then(() => {
        alert(`成功新增 ${parsedItems.length} 筆借用品項至 Google 試算表！`);
        document.getElementById('bulkInputText').value = '';
        parseBulkInput();
        fetchLogs();
      })
      .catch(() => {
        alert("儲存失敗，請再試一次！");
        setLoading(false);
      });
    });

    function editLogItem(logId) {
      const log = logs.find(item => item.id == logId);
      if (!log) return;

      const newName = prompt(`請修改品項名稱：`, log.name);
      if (newName === null || newName.trim() === "") return;

      const newQty = prompt(`請修改數量：`, log.qty);
      if (newQty === null || newQty.trim() === "" || isNaN(newQty)) return;

      sendUpdateToGAS(log.id, newName.trim(), newQty.trim());
    }

    function sendUpdateToGAS(id, name, qty) {
      setLoading(true);
      fetch(GAS_URL, {
        method: "POST",
        body: JSON.stringify({ action: "update", id: id, name: name, qty: qty })
      })
      .then(res => res.json())
      .then(() => fetchLogs());
    }

    function deleteLogItem(logId) {
      const log = logs.find(item => item.id == logId);
      if (!log) return;

      if (confirm(`確定要從雲端刪除【${log.name}】這筆紀錄嗎？`)) {
        setLoading(true);
        fetch(GAS_URL, {
          method: "POST",
          body: JSON.stringify({ action: "delete", id: logId })
        })
        .then(res => res.json())
        .then(() => fetchLogs());
      }
    }

    function renderLogs() {
      const logTableBody = document.getElementById('logTableBody');
      logTableBody.innerHTML = '';
      
      logs.forEach(log => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${log.date}</td>
          <td class="fw-bold">${log.name}</td>
          <td>${log.qty}</td>
          <td class="text-center">
            <button class="btn btn-sm btn-outline-brand py-0 px-1 me-1" onclick="editLogItem('${log.id}')">✏️ 編輯</button>
            <button class="btn btn-sm btn-outline-danger py-0 px-1" onclick="deleteLogItem('${log.id}')">🗑️ 刪除</button>
          </td>
        `;
        logTableBody.appendChild(tr);
      });
    }

    function exportToCSV() {
      if (logs.length === 0) {
        alert("目前沒有紀錄可匯出！");
        return;
      }
      const todayStr = new Date().toISOString().split('T')[0];
      let csvContent = "借用日期,品項名稱,數量\n";
      logs.forEach(log => {
        csvContent += `"${log.date}","${log.name}","${log.qty}"\n`;
      });
      downloadCSV(csvContent, `借用品項明細紀錄_${todayStr}.csv`);
    }

    function calculateMonthlySummary() {
      const selectedMonth = document.getElementById('monthPicker').value;
      if (!selectedMonth) return;

      monthlyMap = {};

      logs.forEach(item => {
        if (item.date && item.date.startsWith(selectedMonth)) {
          const name = item.name.trim();
          const qty = parseFloat(item.qty) || 0;

          if (!monthlyMap[name]) {
            monthlyMap[name] = { totalQty: 0, count: 0 };
          }
          
          monthlyMap[name].totalQty += qty;
          monthlyMap[name].count += 1;
        }
      });

      document.getElementById('summaryTitle').innerText = `${selectedMonth} 月度彙整結果`;
      renderSummaryTable();
    }

    function renderSummaryTable() {
      const tableBody = document.getElementById('summaryTableBody');
      const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
      tableBody.innerHTML = '';

      const itemNames = Object.keys(monthlyMap);
      let displayIndex = 1;

      if (itemNames.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="4" class="text-center text-muted">該月份尚無任何借用紀錄</td></tr>`;
        document.getElementById('totalSpeciesBadge').innerText = `共 0 種品項`;
        return;
      }

      itemNames.forEach(name => {
        if (keyword && !name.toLowerCase().includes(keyword)) return;

        const data = monthlyMap[name];

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="text-center fw-bold text-secondary">${displayIndex++}</td>
          <td class="fw-bold text-dark">${name}</td>
          <td class="text-center fs-5 fw-bold" style="color: var(--brand-brown);">${data.totalQty}</td>
          <td class="text-center text-muted">${data.count} 次</td>
        `;
        tableBody.appendChild(tr);
      });

      document.getElementById('totalSpeciesBadge').innerText = `共 ${displayIndex - 1} 種品項`;
    }

    function exportSummaryCSV() {
      const selectedMonth = document.getElementById('monthPicker').value;
      const itemNames = Object.keys(monthlyMap);

      if (itemNames.length === 0) {
        alert("目前月份沒有資料可匯出！");
        return;
      }

      let csvContent = `月份,品項名稱,當月總借用數量,紀錄次數\n`;
      itemNames.forEach(name => {
        const data = monthlyMap[name];
        csvContent += `"${selectedMonth}","${name}","${data.totalQty}","${data.count}"\n`;
      });

      downloadCSV(csvContent, `借用品項月度總量統計_${selectedMonth}.csv`);
    }

    function downloadCSV(csvContent, fileName) {
      const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      const url = URL.createObjectURL(blob);
      link.setAttribute("href", url);
      link.setAttribute("download", fileName);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>

</body>
</html>
