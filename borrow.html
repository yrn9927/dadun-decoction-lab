<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大墩水藥室借用管理系統 - 風澤醫療體系</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --bg-main: #f7f4ef;
      --text-primary: #4a3b32;
      --text-muted: #7e6f65;
      --brand-brown: #6b5240;
      --brand-brown-hover: #543f30;
      --brand-sage: #5c7258;
      --brand-sage-hover: #485b45;
      --border-color: #e5dec9;
      --card-bg: #ffffff;
      --accent-light: #f3ede2;
      --badge-bg: #f4efe6;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 20px;
    }

    .brand-header {
      background-color: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px 24px;
      box-shadow: 0 2px 8px rgba(74, 59, 50, 0.05);
    }
    .brand-logo {
      height: 38px;
      object-fit: contain;
    }
    .header-divider {
      width: 1px;
      height: 24px;
      background-color: #c5b8a5;
    }
    .header-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: 0.5px;
    }

    .btn-home {
      background-color: #ffffff;
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      border-radius: 50rem;
      padding: 6px 16px;
      font-size: 0.9rem;
      font-weight: 600;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .btn-home:hover {
      background-color: var(--accent-light);
      color: var(--brand-brown);
      border-color: #d1c5b4;
    }
    .badge-brand {
      background-color: var(--badge-bg);
      color: var(--text-primary);
      border: 1px solid #e2d8c8;
      border-radius: 50rem;
      padding: 6px 16px;
      font-size: 0.88rem;
      font-weight: 500;
    }

    .main-container {
      background-color: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 12px rgba(74, 59, 50, 0.03);
    }
    .card {
      border: 1px solid var(--border-color);
      border-radius: 8px;
    }
    .card-header {
      background-color: var(--accent-light);
      border-bottom: 1px solid var(--border-color);
      color: var(--text-primary);
      font-weight: 600;
    }

    .nav-tabs {
      border-bottom: 2px solid var(--border-color);
    }
    .nav-tabs .nav-link {
      color: var(--text-muted);
      font-weight: 600;
      border: none;
      border-bottom: 3px solid transparent;
      border-radius: 0;
      padding: 10px 18px;
    }
    .nav-tabs .nav-link.active {
      color: var(--brand-brown);
      background-color: transparent;
      border-bottom: 3px solid var(--brand-brown);
    }

    .btn-brand-primary {
      background-color: var(--brand-sage);
      color: #ffffff;
      border: none;
    }
    .btn-brand-primary:hover {
      background-color: var(--brand-sage-hover);
      color: #ffffff;
    }
    .btn-outline-brand {
      color: var(--brand-brown);
      border-color: var(--brand-brown);
    }
    .btn-outline-brand:hover {
      background-color: var(--brand-brown);
      color: #ffffff;
    }

    .table-light-header th {
      background-color: var(--accent-light);
      color: var(--text-primary);
    }

    .preview-box {
      background-color: var(--accent-light);
      border-radius: 6px;
      padding: 15px;
    }
    #loadingSpinner { display: none; }

    /* 品項獨立表格卡片樣式 */
    .item-card {
      border: 1px solid #7cb5ec;
      border-radius: 4px;
      overflow: hidden;
      background-color: #ffffff;
    }
    .item-card-header {
      background-color: #b2d7f5;
      color: #112233;
      font-weight: 700;
      font-size: 1.25rem;
      text-align: center;
      padding: 8px;
      border-bottom: 1px solid #7cb5ec;
      letter-spacing: 1px;
    }
    .item-card-table {
      margin-bottom: 0;
      font-size: 0.9rem;
    }
    .item-card-table th {
      background-color: #eaf4fd;
      color: #333333;
      font-weight: 600;
      border-bottom: 1px solid #b2d7f5;
      padding: 6px 4px;
    }
    .item-card-table td {
      padding: 6px 4px;
      border-color: #d8e6f5;
    }

    /* 下訂通知清單樣式 */
    .order-item-card {
      border-left: 6px solid #d9534f;
      transition: all 0.2s ease;
      background-color: #ffffff;
    }
    .order-item-card.completed {
      border-left-color: #198754;
      background-color: #f4f9f5;
      opacity: 0.85;
    }
    .order-item-card.completed .order-text {
      text-decoration: line-through;
      color: #6c757d;
    }

    /* 顯眼勾選框專用按鈕區塊 */
    .checkbox-box {
      background-color: #f8f1e7;
      border: 2px solid #6b5240;
      border-radius: 10px;
      padding: 8px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      min-width: 85px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.08);
    }
    .checkbox-box:hover {
      background-color: #ebd2b9;
      transform: scale(1.05);
    }
    .order-item-card.completed .checkbox-box {
      background-color: #d1e7dd;
      border-color: #198754;
    }

    .form-check-input-lg {
      width: 2rem;
      height: 2rem;
      cursor: pointer;
      border: 2.5px solid #6b5240;
      border-radius: 6px;
    }
    .form-check-input-lg:checked {
      background-color: #198754;
      border-color: #198754;
    }
  </style>
</head>
<body>

  <header class="brand-header mb-4 d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-center gap-3">
      <img src="logo.png" alt="風澤醫療體系 LOGO" class="brand-logo">
      <div class="header-divider"></div>
      <h1 class="header-title mb-0">大墩水藥室借用管理系統</h1>
    </div>
    <div class="d-flex align-items-center gap-2">
      <a href="index.html" class="btn btn-home text-decoration-none">
        🏠 返回主控台
      </a>
      <span class="badge-brand">風澤醫療體系</span>
      <div id="loadingSpinner" class="spinner-border spinner-border-sm text-secondary ms-2" role="status">
        <span class="visually-hidden">載入中...</span>
      </div>
    </div>
  </header>

  <div class="main-container">
    <ul class="nav nav-tabs mb-4" id="mainTab" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="input-tab" data-bs-toggle="tab" data-bs-target="#input-pane" type="button" role="tab">✍️ 借用品項批次輸入</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="summary-tab" data-bs-toggle="tab" data-bs-target="#summary-pane" type="button" role="tab" onclick="renderSummaryCards()">📋 品項借用流水帳</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link position-relative" id="order-tab" data-bs-toggle="tab" data-bs-target="#order-pane" type="button" role="tab" onclick="renderOrderNotifications()">
          🔔 採購下訂通知
          <span id="pendingBadge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="display: none;">0</span>
        </button>
      </li>
    </ul>

    <div class="tab-content" id="mainTabContent">

      <!-- 頁籤一：輸入與歷史紀錄 -->
      <div class="tab-pane fade show active" id="input-pane" role="tabpanel">
        <div class="card mb-4">
          <div class="card-header d-flex justify-content-between align-items-center">
            <h5 class="m-0">借用品項輸入區</h5>
          </div>
          <div class="card-body">
            <form id="batchForm">
              <div class="row mb-3">
                <div class="col-md-12">
                  <label class="form-label fw-bold">借用日期</label>
                  <input type="date" id="batchDate" class="form-control" required>
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label fw-bold">文字批次輸入框 
                  <span class="fs-6 font-monospace" style="color: var(--brand-brown);">(格式：品項名稱 數量)</span>
                </label>
                <textarea id="bulkInputText" class="form-control font-monospace" rows="5" placeholder="例如：
仙粒 5
酸梅 2
梅餅 10
大牛皮紙袋 100
小牛皮紙袋 50" oninput="parseBulkInput()"></textarea>
                <div class="form-text">提示：品項名稱與數量之間請用「空白」隔開即可（預設數量為 1）。</div>
              </div>

              <div id="previewArea" class="preview-box mb-3" style="display: none;">
                <h6 class="fw-bold mb-2" style="color: var(--brand-brown);">🔍 即時解析結果預覽：</h6>
                <div class="table-responsive">
                  <table class="table table-sm table-bordered bg-white mb-0">
                    <thead class="table-light-header">
                      <tr>
                        <th>品項名稱</th>
                        <th style="width: 120px;" class="text-center">數量</th>
                      </tr>
                    </thead>
                    <tbody id="previewTableBody"></tbody>
                  </table>
                </div>
              </div>

              <button type="submit" id="submitBtn" class="btn btn-brand-primary w-100 mt-2 py-2 fw-bold" disabled>一次性儲存至雲端試算表</button>
            </form>
          </div>
        </div>

        <div class="card">
          <div class="card-header d-flex justify-content-between align-items-center">
            <h5 class="m-0">雲端同步歷史紀錄</h5>
            <div>
              <button class="btn btn-sm btn-outline-brand me-2" onclick="fetchLogs()">🔄 重新整理資料</button>
              <button class="btn btn-sm btn-outline-success" onclick="exportToCSV()">匯出明細 CSV</button>
            </div>
          </div>
          <div class="card-body">
            <div class="table-responsive">
              <table class="table table-striped table-hover align-middle">
                <thead>
                  <tr>
                    <th>借用日期</th>
                    <th>品項名稱</th>
                    <th style="width: 120px;">數量</th>
                    <th style="width: 150px;" class="text-center">紀錄操作</th>
                  </tr>
                </thead>
                <tbody id="logTableBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

      <!-- 頁籤二：品項借用流水帳卡片區 -->
      <div class="tab-pane fade" id="summary-pane" role="tabpanel">
        <div class="card mb-4">
          <div class="card-body">
            <div class="row g-3 align-items-center">
              <div class="col-md-8">
                <label class="form-label fw-bold">搜尋品項名稱：</label>
                <input type="text" id="searchInput" class="form-control" placeholder="輸入品項名稱關鍵字搜尋..." oninput="renderSummaryCards()">
              </div>
              <div class="col-md-4 d-flex align-items-end justify-content-between gap-2">
                <span class="badge badge-brand fs-6 py-2 px-3" id="totalSpeciesBadge">共 0 種品項</span>
                <button class="btn btn-brand-primary" onclick="exportSummaryCSV()">匯出流水帳 CSV</button>
              </div>
            </div>
          </div>
        </div>

        <div class="row g-4" id="summaryCardsContainer"></div>
      </div>

      <!-- 頁籤三：採購下訂通知區 -->
      <div class="tab-pane fade" id="order-pane" role="tabpanel">
        <div class="card mb-4">
          <div class="card-body d-flex justify-content-between align-items-center flex-wrap gap-2">
            <div>
              <h5 class="fw-bold mb-1" style="color: var(--brand-brown);">📢 滿箱採購提醒清單</h5>
              <p class="text-muted mb-0 small">每當借用量達標 1 箱規格，系統即會發出 1 箱的下訂提醒。</p>
            </div>
            <div class="d-flex align-items-center gap-3">
              <div class="form-check form-switch m-0">
                <input class="form-check-input" type="checkbox" id="hideCompletedSwitch" onchange="renderOrderNotifications()">
                <label class="form-check-input-label fw-bold" for="hideCompletedSwitch" style="cursor: pointer; color: var(--brand-brown);">🙈 隱藏已完成項目</label>
              </div>
              <button class="btn btn-sm btn-outline-secondary" onclick="resetOrderCheckboxes()">重設所有勾選狀態</button>
            </div>
          </div>
        </div>

        <div id="orderNotificationContainer" class="d-flex flex-column gap-3">
          <!-- 動態插入達標下訂通知卡片 -->
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwz3E-EO3dGsraL9NFGMU7sU13KaZCjrSNieWUWYEEGxYN9PiXSyaePES_qkJP0ENhzWQ/exec";

    // 📦 各品項一箱數量設定 (品項名稱: 滿箱數量)
    const ITEM_BOX_LIMITS = {
      "梅餅": 20,
      "酸梅": 30,
      "梅粒": 40,
      "大牛皮紙袋": 25,
      "小牛皮紙袋": 50
    };

    // 未單獨設定品項的預設門檻
    const DEFAULT_BOX_QTY = 20;

    let logs = [];          
    let parsedItems = [];   

    // 取得在地時區格式化日期 (YYYY-MM-DD)
    function getLocalDateStr() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById('batchDate').value = getLocalDateStr();
      fetchLogs();
    });

    function formatDateDisplay(dateStr) {
      if (!dateStr) return '';
      if (typeof dateStr === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(dateStr.trim())) {
        return dateStr.trim();
      }
      const d = new Date(dateStr);
      if (isNaN(d.getTime())) return dateStr;
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function setLoading(isLoading) {
      document.getElementById('loadingSpinner').style.display = isLoading ? 'inline-block' : 'none';
    }

    function fetchLogs() {
      setLoading(true);
      fetch(GAS_URL)
        .then(res => res.json())
        .then(data => {
          logs = data.map(item => ({
            ...item,
            date: formatDateDisplay(item.date)
          }));
          renderLogs();
          renderSummaryCards();
          renderOrderNotifications();
          setLoading(false);
        })
        .catch(err => {
          alert("無法讀取雲端資料，請檢查網路或 GAS 網址！");
          setLoading(false);
        });
    }

    function parseBulkInput() {
      const rawText = document.getElementById('bulkInputText').value;
      const lines = rawText.split('\n');
      const date = document.getElementById('batchDate').value;

      parsedItems = [];
      const previewTableBody = document.getElementById('previewTableBody');
      previewTableBody.innerHTML = '';

      lines.forEach(line => {
        let trimmed = line.trim();
        if (!trimmed) return;

        const parts = trimmed.split(/\s+/).filter(Boolean);
        if (parts.length === 0) return;

        const name = parts[0];
        let qty = 1;

        if (parts.length >= 2 && !isNaN(parts[1])) {
          qty = parts[1];
        }

        parsedItems.push({
          id: Date.now() + "_" + Math.floor(Math.random() * 10000),
          date: date,
          name: name,
          qty: qty
        });

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="fw-bold">${name}</td>
          <td class="text-center">${qty}</td>
        `;
        previewTableBody.appendChild(tr);
      });

      const previewArea = document.getElementById('previewArea');
      const submitBtn = document.getElementById('submitBtn');

      if (parsedItems.length > 0) {
        previewArea.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.innerText = `一次性儲存共 ${parsedItems.length} 項借用品項至雲端`;
      } else {
        previewArea.style.display = 'none';
        submitBtn.disabled = true;
        submitBtn.innerText = "一次性儲存至雲端試算表";
      }
    }

    document.getElementById('batchForm').addEventListener('submit', function(e) {
      e.preventDefault();
      if (parsedItems.length === 0) return;

      setLoading(true);

      fetch(GAS_URL, {
        method: "POST",
        body: JSON.stringify({ action: "add", items: parsedItems })
      })
      .then(res => res.json())
      .then(() => {
        alert(`成功新增 ${parsedItems.length} 筆借用品項至 Google 試算表！`);
        document.getElementById('bulkInputText').value = '';
        parseBulkInput();
        fetchLogs();
      })
      .catch(() => {
        alert("儲存失敗，請再試一次！");
        setLoading(false);
      });
    });

    function editLogItem(logId) {
      const log = logs.find(item => item.id == logId);
      if (!log) return;

      const newName = prompt(`請修改品項名稱：`, log.name);
      if (newName === null || newName.trim() === "") return;

      const newQty = prompt(`請修改數量：`, log.qty);
      if (newQty === null || newQty.trim() === "" || isNaN(newQty)) return;

      sendUpdateToGAS(log.id, newName.trim(), newQty.trim());
    }

    function sendUpdateToGAS(id, name, qty) {
      setLoading(true);
      fetch(GAS_URL, {
        method: "POST",
        body: JSON.stringify({ action: "update", id: id, name: name, qty: qty })
      })
      .then(res => res.json())
      .then(() => fetchLogs());
    }

    function deleteLogItem(logId) {
      const log = logs.find(item => item.id == logId);
      if (!log) return;

      if (confirm(`確定要從雲端刪除【${log.name}】這筆紀錄嗎？`)) {
        setLoading(true);
        fetch(GAS_URL, {
          method: "POST",
          body: JSON.stringify({ action: "delete", id: logId })
        })
        .then(res => res.json())
        .then(() => fetchLogs());
      }
    }

    function renderLogs() {
      const logTableBody = document.getElementById('logTableBody');
      logTableBody.innerHTML = '';
      
      logs.forEach(log => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${log.date}</td>
          <td class="fw-bold">${log.name}</td>
          <td>${log.qty}</td>
          <td class="text-center">
            <button class="btn btn-sm btn-outline-brand py-0 px-1 me-1" onclick="editLogItem('${log.id}')">✏️ 編輯</button>
            <button class="btn btn-sm btn-outline-danger py-0 px-1" onclick="deleteLogItem('${log.id}')">🗑️ 刪除</button>
          </td>
        `;
        logTableBody.appendChild(tr);
      });
    }

    function renderSummaryCards() {
      const container = document.getElementById('summaryCardsContainer');
      const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
      container.innerHTML = '';

      const itemGroups = {};
      logs.forEach(item => {
        if (!item.name) return;
        const name = item.name.trim();
        if (!itemGroups[name]) {
          itemGroups[name] = [];
        }
        itemGroups[name].push(item);
      });

      const itemNames = Object.keys(itemGroups).filter(name => {
        return !keyword || name.toLowerCase().includes(keyword);
      });

      document.getElementById('totalSpeciesBadge').innerText = `共 ${itemNames.length} 種品項`;

      if (itemNames.length === 0) {
        container.innerHTML = `<div class="col-12 text-center text-muted py-5">尚無符合關鍵字的借用品項資料</div>`;
        return;
      }

      itemNames.forEach(name => {
        const records = itemGroups[name].sort((a, b) => new Date(a.date) - new Date(b.date));
        
        let cumulativeTotal = 0;
        let rowsHtml = '';

        records.forEach((rec, index) => {
          const qty = parseFloat(rec.qty) || 0;
          cumulativeTotal += qty;
          
          rowsHtml += `
            <tr>
              <td class="text-center text-secondary">${index + 1}</td>
              <td class="text-center">${rec.date}</td>
              <td class="text-center fw-bold">${qty}</td>
              <td class="text-center fw-bold text-primary">${cumulativeTotal}</td>
            </tr>
          `;
        });

        const col = document.createElement('div');
        col.className = 'col-md-6 col-xl-4';
        col.innerHTML = `
          <div class="item-card shadow-sm h-100">
            <div class="item-card-header">
              ${name}
            </div>
            <div class="table-responsive">
              <table class="table table-bordered item-card-table text-center align-middle">
                <thead>
                  <tr>
                    <th style="width: 45px;">NO.</th>
                    <th>日期</th>
                    <th style="width: 75px;">借用量</th>
                    <th style="width: 75px;">總計</th>
                  </tr>
                </thead>
                <tbody>
                  ${rowsHtml}
                </tbody>
              </table>
            </div>
          </div>
        `;
        container.appendChild(col);
      });
    }

    function renderOrderNotifications() {
      const container = document.getElementById('orderNotificationContainer');
      const hideCompleted = document.getElementById('hideCompletedSwitch').checked;
      container.innerHTML = '';

      const itemGroups = {};
      logs.forEach(item => {
        if (!item.name) return;
        const name = item.name.trim();
        if (!itemGroups[name]) itemGroups[name] = [];
        itemGroups[name].push(item);
      });

      const notifications = [];

      Object.keys(itemGroups).forEach(name => {
        const records = itemGroups[name].sort((a, b) => new Date(a.date) - new Date(b.date));
        let currentCum = 0;
        let reachedBoxes = 0;

        const boxLimit = ITEM_BOX_LIMITS[name] || DEFAULT_BOX_QTY;

        records.forEach(rec => {
          const qty = parseFloat(rec.qty) || 0;
          currentCum += qty;

          while (currentCum >= (reachedBoxes + 1) * boxLimit) {
            reachedBoxes++;
            notifications.push({
              id: `order_${name}_box_${reachedBoxes}`,
              name: name,
              date: rec.date,
              boxNum: reachedBoxes,
              totalQty: currentCum,
              unitQty: boxLimit
            });
          }
        });
      });

      notifications.sort((a, b) => new Date(b.date) - new Date(a.date));

      let pendingCount = 0;
      let visibleCardCount = 0;

      notifications.forEach(notif => {
        const isChecked = localStorage.getItem(notif.id) === 'true';
        if (!isChecked) pendingCount++;

        if (hideCompleted && isChecked) return;

        visibleCardCount++;
        const dateObj = new Date(notif.date);
        const formattedMonthDay = `${dateObj.getMonth() + 1}／${dateObj.getDate()}`;

        const card = document.createElement('div');
        card.className = `card order-item-card p-3 shadow-sm ${isChecked ? 'completed' : ''}`;
        card.id = `card_${notif.id}`;
        card.innerHTML = `
          <div class="d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center gap-3">
              <label class="checkbox-box" for="${notif.id}">
                <input class="form-check-input form-check-input-lg m-0" type="checkbox" id="${notif.id}" ${isChecked ? 'checked' : ''} onchange="toggleOrderCheck('${notif.id}')">
                <span class="fw-bold mt-1 text-center" id="txt_${notif.id}" style="font-size: 0.72rem; color: var(--brand-brown);">
                  ${isChecked ? '已下訂' : '點我打勾'}
                </span>
              </label>
              <div>
                <div class="fs-5 fw-bold order-text">
                  【${notif.name}】於 ${formattedMonthDay} 達標第 ${notif.boxNum} 箱，<span class="text-danger fw-bold">請通知下訂 1 箱</span>
                </div>
                <div class="text-muted small mt-1">
                  達標日期：${notif.date} ｜ 包裝規格：${notif.unitQty} 包/箱 ｜ 當時累積借用總量：${notif.totalQty} 包
                </div>
              </div>
            </div>
            <span class="badge ${isChecked ? 'bg-success' : 'bg-danger'} px-3 py-2 fs-6" id="badge_${notif.id}">
              ${isChecked ? '已完成下訂' : '待處理下訂'}
            </span>
          </div>
        `;
        container.appendChild(card);
      });

      if (visibleCardCount === 0) {
        container.innerHTML = `<div class="text-center text-muted py-5">${hideCompleted ? '尚無待處理的採購通知' : '目前尚無累計滿箱的品項通知'}</div>`;
      }

      const pendingBadge = document.getElementById('pendingBadge');
      if (pendingCount > 0) {
        pendingBadge.innerText = pendingCount;
        pendingBadge.style.display = 'inline-block';
      } else {
        pendingBadge.style.display = 'none';
      }
    }

    function toggleOrderCheck(id) {
      const checkbox = document.getElementById(id);
      const isChecked = checkbox.checked;
      localStorage.setItem(id, isChecked);

      const hideCompleted = document.getElementById('hideCompletedSwitch').checked;

      if (hideCompleted) {
        renderOrderNotifications();
        return;
      }

      const card = document.getElementById(`card_${id}`);
      const badge = document.getElementById(`badge_${id}`);
      const txt = document.getElementById(`txt_${id}`);

      if (isChecked) {
        card.classList.add('completed');
        badge.className = 'badge bg-success px-3 py-2 fs-6';
        badge.innerText = '已完成下訂';
        if (txt) txt.innerText = '已下訂';
      } else {
        card.classList.remove('completed');
        badge.className = 'badge bg-danger px-3 py-2 fs-6';
        badge.innerText = '待處理下訂';
        if (txt) txt.innerText = '點我打勾';
      }

      const allCheckboxes = document.querySelectorAll('#orderNotificationContainer input[type="checkbox"]');
      let pending = 0;
      allCheckboxes.forEach(cb => { if (!cb.checked) pending++; });

      const pendingBadge = document.getElementById('pendingBadge');
      if (pending > 0) {
        pendingBadge.innerText = pending;
        pendingBadge.style.display = 'inline-block';
      } else {
        pendingBadge.style.display = 'none';
      }
    }

    function resetOrderCheckboxes() {
      if (confirm('確定要重設所有項目的勾選狀態（恢復為待處理）嗎？')) {
        Object.keys(localStorage).forEach(key => {
          if (key.startsWith('order_')) {
            localStorage.removeItem(key);
          }
        });
        renderOrderNotifications();
      }
    }

    function exportToCSV() {
      if (logs.length === 0) {
        alert("目前沒有紀錄可匯出！");
        return;
      }
      const todayStr = getLocalDateStr();
      let csvContent = "借用日期,品項名稱,數量\n";
      logs.forEach(log => {
        csvContent += `"${log.date}","${log.name}","${log.qty}"\n`;
      });
      downloadCSV(csvContent, `借用品項明細紀錄_${todayStr}.csv`);
    }

    function exportSummaryCSV() {
      if (logs.length === 0) {
        alert("目前沒有資料可匯出！");
        return;
      }

      const todayStr = getLocalDateStr();
      let csvContent = `品項名稱,NO.,日期,借用數量,累積總計\n`;
      
      const itemGroups = {};
      logs.forEach(item => {
        if (!item.name) return;
        const name = item.name.trim();
        if (!itemGroups[name]) itemGroups[name] = [];
        itemGroups[name].push(item);
      });

      Object.keys(itemGroups).forEach(name => {
        const records = itemGroups[name].sort((a, b) => new Date(a.date) - new Date(b.date));
        let cumulativeTotal = 0;
        records.forEach((rec, index) => {
          const qty = parseFloat(rec.qty) || 0;
          cumulativeTotal += qty;
          csvContent += `"${name}","${index + 1}","${rec.date}","${qty}","${cumulativeTotal}"\n`;
        });
      });

      downloadCSV(csvContent, `品項借用流水帳匯總_${todayStr}.csv`);
    }

    function downloadCSV(csvContent, fileName) {
      const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      const url = URL.createObjectURL(blob);
      link.setAttribute("href", url);
      link.setAttribute("download", fileName);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>

</body>
</html>
