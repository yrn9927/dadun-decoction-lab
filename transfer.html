<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大墩水藥室管理系統 - 風澤醫療體系</title>
  <!-- 引入 Tailwind CSS 與 Vue.js --><!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大墩水藥室管理系統 - 風澤醫療體系</title>
  <!-- 引入 Tailwind CSS 與 Vue.js -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script>
    // 自訂風澤醫療體系品牌配色
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#FAF7F2',   // 全局暖背景色
              100: '#F5ECE1',  // 淺色卡片/高亮背景
              200: '#E6D5C3',  // 柔和邊框色
              300: '#D4BBA3',  // 輸入框/分隔線邊框
              400: '#B89274',  // 輔助標示色
              500: '#8C6649',  // 次要按鈕/文字
              600: '#6B4C35',  // 主品牌棕色 (主按鈕/標題)
              700: '#543B28',  // Hover 懸停加深
              800: '#3D2A1C',  // 深色內文
              900: '#281B12'
            }
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&display=swap');
    .font-serif-tc { font-family: 'Noto Serif TC', serif; }
  </style>
</head>
<body class="bg-brand-50 min-h-screen p-4 md:p-6 text-brand-800">
  <div id="app" class="max-w-6xl mx-auto">
    
    <!-- 頂部 Header：品牌 Logo 圖片、系統標題列與回首頁按鈕 -->
    <header class="bg-white border-b border-brand-200 px-6 py-4 mb-6 rounded-xl shadow-xs flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center space-x-4">
        <!-- Logo 圖片區域 -->
        <img src="logo.png" alt="風澤醫療體系 Logo" class="h-10 w-auto object-contain">
        <!-- 分隔線 -->
        <div class="h-6 w-[1.5px] bg-gray-300"></div>
        <!-- 系統標題 -->
        <h1 class="text-xl font-bold text-brand-800 tracking-wide">大墩水藥室管理系統</h1>
      </div>

      <!-- 右側按鈕區塊 -->
      <div class="flex items-center gap-3">
        <!-- 返回主控台按鈕 -->
        <a href="index.html" class="inline-flex items-center gap-1.5 text-xs font-bold bg-brand-50 hover:bg-brand-100 text-brand-700 border border-brand-200 px-3.5 py-2 rounded-lg transition-colors shadow-2xs">
          🏠 返回主控台
        </a>
        <!-- 品牌膠囊標籤 -->
        <span class="hidden sm:inline-block px-4 py-1.5 border border-brand-200 bg-brand-50 text-brand-600 rounded-full text-sm font-medium shadow-2xs">
          風澤醫療體系
        </span>
      </div>
    </header>

    <!-- 頁籤切換：前台輸入 vs 後台管理 -->
    <div class="flex border-b border-brand-200 mb-6 bg-white rounded-t-xl shadow-xs overflow-hidden">
      <button @click="currentTab = 'input'" 
              :class="['px-6 py-3.5 font-bold transition-all', currentTab === 'input' ? 'border-b-2 border-brand-600 text-brand-600 bg-brand-50/50' : 'text-gray-500 hover:text-brand-600']">
        📝 填寫調撥單
      </button>
      <button @click="currentTab = 'admin'; fetchLogs()" 
              :class="['px-6 py-3.5 font-bold flex items-center gap-2 transition-all', currentTab === 'admin' ? 'border-b-2 border-brand-600 text-brand-600 bg-brand-50/50' : 'text-gray-500 hover:text-brand-600']">
        📊 後台管理與歷史查詢
        <span v-if="loading" class="animate-spin text-xs">🌀</span>
      </button>
    </div>

    <!-- 1. 前端填寫頁面 -->
    <div v-if="currentTab === 'input'" class="bg-white p-6 rounded-xl shadow-sm border border-brand-200">
      <div class="flex justify-between items-center mb-5 border-b border-brand-100 pb-3">
        <h2 class="text-lg font-bold text-brand-800">院所調撥單輸入（共 {{ items.length }} 項）</h2>
        <span class="text-xs font-semibold text-brand-700 bg-brand-100 px-3 py-1.5 rounded-full border border-brand-200">已填寫 {{ activeItemsCount }} 項</span>
      </div>
      
      <!-- 院所資訊與日期欄位 -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-5 bg-brand-50/60 p-4 rounded-lg border border-brand-200">
        <div>
          <label class="block text-xs font-bold text-brand-700 mb-1.5">📅 調撥日期</label>
          <input type="date" v-model="orderDate" class="border border-brand-300 p-2 rounded-lg w-full bg-white text-sm focus:ring-2 focus:ring-brand-400 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-brand-700 mb-1.5">🏥 調出院所（提供方）</label>
          <input type="text" v-model="fromClinic" placeholder="請輸入或選擇院所" list="clinic-list" class="border border-brand-300 p-2 rounded-lg w-full bg-white text-sm focus:ring-2 focus:ring-brand-400 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-brand-700 mb-1.5">🏥 調入力院所（需求方）</label>
          <input type="text" v-model="toClinic" placeholder="請輸入或選擇院所" list="clinic-list" class="border border-brand-300 p-2 rounded-lg w-full bg-white text-sm focus:ring-2 focus:ring-brand-400 focus:outline-none">
        </div>
        
        <datalist id="clinic-list">
          <option value="大墩水藥室"></option>
          <option value="大墩"></option>
          <option value="大里"></option>
          <option value="福科"></option>
          <option value="竹北"></option>
          <option value="湖口"></option>
          <option value="南竹水藥室"></option>
        </datalist>
      </div>

      <!-- 關鍵字搜尋 -->
      <div class="mb-5">
        <label class="block text-xs font-bold text-brand-700 mb-1.5">🔍 快速搜尋品項</label>
        <input type="text" v-model="searchKeyword" placeholder="輸入藥名或關鍵字 (如：轉骨、膠囊、面膜)..." class="border border-brand-300 p-2.5 rounded-lg w-full text-sm focus:ring-2 focus:ring-brand-400 focus:outline-none">
      </div>

      <!-- 品項清單 -->
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 max-h-[500px] overflow-y-auto p-3 border border-brand-200 rounded-lg bg-brand-50/30">
        <div v-for="item in filteredItems" :key="item.name" 
             :class="['flex justify-between items-center p-3 rounded-lg border transition-all', item.qty > 0 ? 'bg-brand-100/80 border-brand-400 shadow-2xs' : 'bg-white border-brand-200 hover:border-brand-300']">
          <span class="font-medium text-sm text-brand-800 pr-2">{{ item.name }}</span>
          <input type="number" min="0" placeholder="0" v-model.number="item.qty" class="border border-brand-300 p-1 w-20 text-center rounded-md focus:ring-2 focus:ring-brand-400 font-bold text-brand-700 bg-white">
        </div>
      </div>

      <!-- 送出按鈕 -->
      <button @click="submitOrder" :disabled="submitting" class="mt-6 w-full bg-brand-600 hover:bg-brand-700 text-white font-bold py-3.5 rounded-xl shadow-md hover:shadow-lg transition-all text-base flex justify-center items-center gap-2 cursor-pointer disabled:opacity-50">
        <span v-if="submitting">資料傳送中...</span>
        <span v-else>送出調撥單（同步至雲端）</span>
      </button>
    </div>

    <!-- 2. 後台統計與歷史查詢頁面 -->
    <div v-if="currentTab === 'admin'" class="bg-white p-6 rounded-xl shadow-sm border border-brand-200">
      <div class="flex flex-wrap justify-between items-center border-b border-brand-100 pb-4 mb-6 gap-4">
        <div class="flex items-center gap-3">
          <h2 class="text-lg font-bold text-brand-800">後台調撥數據統計與管理</h2>
          <button @click="fetchLogs" class="text-xs bg-brand-50 hover:bg-brand-100 text-brand-700 px-3 py-1.5 rounded-lg border border-brand-200 flex items-center gap-1 transition-colors">
            🔄 重新整理雲端資料
          </button>
        </div>
        
        <!-- 月份與單品項複合過濾器 -->
        <div class="flex flex-col sm:flex-row items-start sm:items-center gap-3 bg-brand-50 p-3 rounded-lg border border-brand-200 w-full lg:w-auto">
          <div class="flex items-center gap-2">
            <label class="text-xs font-bold text-brand-700 shrink-0">📅 查詢月份：</label>
            <input type="month" v-model="selectedMonth" class="border border-brand-300 p-1.5 rounded-md bg-white text-xs focus:ring-2 focus:ring-brand-400">
          </div>
          <div class="flex items-center gap-2 w-full sm:w-auto">
            <label class="text-xs font-bold text-brand-700 shrink-0">💊 單品項查詢：</label>
            <input type="text" v-model="selectedItem" placeholder="輸入品項名稱關鍵字" class="border border-brand-300 p-1.5 rounded-md bg-white text-xs focus:ring-2 focus:ring-brand-400 w-full sm:w-40">
          </div>
          <button @click="selectedMonth = ''; selectedItem = ''" class="text-xs bg-white hover:bg-brand-100 border border-brand-200 px-2.5 py-1.5 rounded-md font-medium text-brand-700 shrink-0 transition-colors">
            重置篩選
          </button>
        </div>
      </div>

      <!-- 載入中狀態 -->
      <div v-if="loading" class="text-center py-12 text-brand-600 font-bold text-base">
        ☁️ 正在連線至雲端讀取最新調撥紀錄...
      </div>

      <template v-else>
        <!-- 每日與院所調撥明細 -->
        <div class="mb-8">
          <h3 class="font-bold text-brand-800 mb-3 flex items-center gap-2 text-sm flex-wrap">
            <span>📅 調撥紀錄明細</span>
            <span class="text-xs bg-brand-50 px-2 py-0.5 rounded text-brand-600 border border-brand-200" v-if="selectedMonth">月份：{{ selectedMonth }}</span>
            <span class="text-xs bg-brand-50 px-2 py-0.5 rounded text-brand-600 border border-brand-200" v-if="selectedItem">品項：{{ selectedItem }}</span>
          </h3>

          <div v-for="(logs, groupKey) in filteredGroupedLogs" :key="groupKey" class="mb-4 border border-brand-200 rounded-xl p-4 bg-brand-50/40 shadow-2xs">
            <div class="flex flex-wrap justify-between items-center border-b border-brand-200 pb-2.5 mb-3">
              <div class="font-bold text-brand-700 text-sm md:text-base">
                📅 日期：{{ logs[0].date }}
              </div>
              <div class="text-xs bg-brand-100 text-brand-700 px-3 py-1 rounded-full font-bold border border-brand-200">
                🔄 {{ logs[0].fromClinic }} ➔ {{ logs[0].toClinic }}
              </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-2.5">
              <div v-for="log in logs" :key="log.id" class="bg-white p-2.5 border border-brand-200 rounded-lg shadow-2xs flex justify-between items-center">
                <span class="text-sm font-medium text-brand-800">{{ log.name }}</span>
                <div class="flex items-center gap-1.5">
                  <span class="font-bold text-amber-800 bg-amber-50 px-2 py-0.5 rounded border border-amber-200 text-xs mr-1">x {{ log.qty }}</span>
                  <button @click="editLogQty(log)" class="text-xs bg-amber-600 hover:bg-amber-700 text-white px-2 py-1 rounded-md transition-colors" title="修改數量">✏️</button>
                  <button @click="deleteLog(log.id)" class="text-xs bg-rose-600 hover:bg-rose-700 text-white px-2 py-1 rounded-md transition-colors" title="刪除此筆">🗑️</button>
                </div>
              </div>
            </div>
          </div>
          <div v-if="Object.keys(filteredGroupedLogs).length === 0" class="text-center py-8 text-gray-400 text-sm">當前篩選條件下無調撥紀錄</div>
        </div>

        <!-- 統計總覽 -->
        <div>
          <div class="flex flex-wrap justify-between items-center mb-3 gap-2">
            <h3 class="font-bold text-brand-800 flex items-center gap-2 text-sm">
              <span>📊 品項累積總數匯整</span>
              <span class="text-xs font-normal text-gray-500">（根據所選篩選條件自動即時計算）</span>
            </h3>
            <div class="flex gap-2">
              <button @click="copyQuantities" class="text-xs bg-brand-600 hover:bg-brand-700 text-white px-3 py-1.5 rounded-md font-bold transition-colors cursor-pointer flex items-center gap-1">
                📋 一鍵複製整欄數量
              </button>
              <button @click="exportCSV" class="text-xs bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-md font-bold transition-colors cursor-pointer flex items-center gap-1">
                📥 匯出排序好的 CSV
              </button>
            </div>
          </div>
          <div class="border border-brand-200 rounded-xl overflow-hidden shadow-2xs">
            <table class="w-full border-collapse text-left">
              <thead>
                <tr class="bg-brand-100/70 text-brand-800 border-b border-brand-200 text-sm">
                  <th class="p-3 font-bold">品項名稱</th>
                  <th class="p-3 text-right font-bold">總調撥數量</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-brand-100 bg-white text-sm">
  <tr v-for="item in sortedTotalSummary" :key="item.name" class="hover:bg-brand-50/50 transition-colors">
    <td class="p-3 font-medium text-brand-800">{{ item.name }}</td>
    <td class="p-3 text-right text-brand-600 font-bold text-base">{{ item.total }}</td>
  </tr>
  <tr v-if="sortedTotalSummary.length === 0">
    <td colspan="2" class="p-6 text-center text-gray-400">當前篩選條件下無資料</td>
  </tr>
</tbody>
            </table>
          </div>
        </div>
      </template>
    </div>
  </div>

  <script>
    const { createApp, ref, computed, onMounted } = Vue;

    const GAS_URL = 'https://script.google.com/macros/s/AKfycbzHEkdHXj8VoFZ38iEL6P9WLGoXm_ivARLoQWBLDfPyY2oV-1Qv1Nf7uGr5cMeEByi1fw/exec';

    createApp({
      setup() {
        const currentTab = ref('input');
        
        // 修正為在地時間（解決早晨 UTC 時區導致顯示為昨天的問題）
        const now = new Date();
        const todayStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
        const currentMonthStr = todayStr.substring(0, 7);
        
        const orderDate = ref(todayStr);
        const fromClinic = ref('南竹水藥室');
        const toClinic = ref('大墩水藥室');
        const searchKeyword = ref('');
        const selectedMonth = ref(currentMonthStr);
        const selectedItem = ref('');
        const loading = ref(false);

  const list = [];

  // 依據 Excel (rawItems) 順序，僅列出有數量的品項
  rawItems.forEach(name => {
    if (map[name] !== undefined) {
      list.push({ name, total: map[name] });
    }
  });

  // 若有不在 rawItems 清單內的品項，自動排至最後
  Object.keys(map).forEach(name => {
    if (!rawItems.includes(name)) {
      list.push({ name, total: map[name] });
    }
  });

  return list;
});
