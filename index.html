<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大墩水藥室管理系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-6">
  <div class="max-w-4xl w-full">
    
    <!-- 頁面標題 -->
    <div class="text-center mb-10">
      <h1 class="text-3xl font-bold text-slate-800 mb-2">🌿 大墩水藥室管理系統</h1>
      <p class="text-slate-500 text-sm">請選擇您要使用的功能模組</p>
    </div>

    <!-- 功能卡片區塊 -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      
      <!-- 卡片 1 -->
      <a href="herb-inventory-system.html" class="bg-white p-6 rounded-2xl shadow-sm hover:shadow-md border border-slate-200 transition-all transform hover:-translate-y-1 block group">
        <div class="text-4xl mb-4">📦</div>
        <h2 class="text-xl font-bold text-slate-800 group-hover:text-emerald-600 transition">庫存管理</h2>
        <p class="text-xs text-slate-500 mt-2 leading-relaxed">適合文字批次貼上（如 LINE），可自動解析數量與廠商，追蹤到貨狀態並匯出 CSV。</p>
        <span class="inline-block mt-4 text-xs font-bold text-emerald-600">進入系統 &rarr;</span>
      </a>

      <!-- 卡片 2 -->
      <a href="transfer.html" class="bg-white p-6 rounded-2xl shadow-sm hover:shadow-md border border-slate-200 transition-all transform hover:-translate-y-1 block group">
        <div class="text-4xl mb-4">🔄</div>
        <h2 class="text-xl font-bold text-slate-800 group-hover:text-blue-600 transition">院所調撥系統</h2>
        <p class="text-xs text-slate-500 mt-2 leading-relaxed">適合固定品項點選與跨院區調撥，具備院所流向選擇與歷史紀錄查詢。</p>
        <span class="inline-block mt-4 text-xs font-bold text-blue-600">進入系統 &rarr;</span>
      </a>

      <!-- 卡片 3 -->
      <a href="Chinese-herbs.html" class="bg-white p-6 rounded-2xl shadow-sm hover:shadow-md border border-slate-200 transition-all transform hover:-translate-y-1 block group">
        <div class="text-4xl mb-4">📊</div>
        <h2 class="text-xl font-bold text-slate-800 group-hover:text-amber-600 transition">藥材調撥系統</h2>
        <p class="text-xs text-slate-500 mt-2 leading-relaxed">預留給第三個功能模組使用。</p>
        <span class="inline-block mt-4 text-xs font-bold text-amber-600">進入系統 &rarr;</span>
      </a>

    </div>
  </div>
</body>
</html>
  </div>
</body>
</html>
