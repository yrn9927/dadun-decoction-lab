<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大墩水藥室管理系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .borrow-card {
      position: relative;
      overflow: hidden;
    }

    .borrow-order-alert {
      position: absolute;
      top: 12px;
      right: 12px;
      display: none;
      align-items: center;
      gap: 5px;
      background: #dc3545;
      color: #fff;
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      line-height: 1;
      box-shadow: 0 2px 8px rgba(220, 53, 69, 0.28);
      z-index: 2;
    }

    .borrow-alert-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #fff;
      animation: borrowAlertPulse 1.1s infinite;
    }

    .borrow-order-message {
      display: none;
      margin-top: 10px;
      padding: 7px 9px;
      border-radius: 8px;
      background: #fff1f2;
      color: #b42318;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.4;
    }

    .borrow-card.has-pending-order {
      border-color: #dc3545 !important;
      box-shadow: 0 0 0 2px rgba(220, 53, 69, 0.10), 0 5px 18px rgba(220, 53, 69, 0.12);
    }

    .borrow-card.has-pending-order .borrow-order-alert,
    .borrow-card.has-pending-order .borrow-order-message {
      display: flex;
    }

    @keyframes borrowAlertPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.75); }
    }
  </style>
</head>
<body class="bg-[#F8F5F0] min-h-screen text-[#4A3B32]">

  <header class="bg-white border-b border-[#E2DAD0]">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center">
      <img src="logo.png" alt="大墩水藥室" class="h-12 w-auto">
      <div class="ml-4">
        <h1 class="text-xl font-bold">大墩水藥室管理系統</h1>
        <p class="text-xs text-gray-500 mt-1">院所、藥材、庫存與借用管理</p>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-8">
    <div class="mb-8">
      <div class="rounded-2xl overflow-hidden shadow-sm border border-[#E2DAD0]">
        <img src="fengze_bg.jpg" alt="豐澤中醫院" class="w-full h-48 sm:h-64 md:h-72 object-cover">
      </div>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">

      <a href="herb-inventory-system.html" class="bg-white p-6 rounded-2xl shadow-sm hover:shadow-md border border-[#E2DAD0] hover:border-[#8C6D53] transition-all transform hover:-translate-y-1 block group">
        <div class="text-4xl mb-4">📦</div>
        <h2 class="text-xl font-bold text-[#4A3B32] group-hover:text-[#8C6D53] transition">庫存管理</h2>
        <p class="text-xs text-gray-500 mt-2 leading-relaxed">查看藥材庫存、進貨與出貨紀錄，掌握目前庫存狀況。</p>
        <span class="inline-block mt-4 text-xs font-bold text-[#8C6D53] group-hover:translate-x-1 transition-transform">進入系統 &rarr;</span>
      </a>

      <a href="transfer.html" class="bg-white p-6 rounded-2xl shadow-sm hover:shadow-md border border-[#E2DAD0] hover:border-[#8C6D53] transition-all transform hover:-translate-y-1 block group">
        <div class="text-4xl mb-4">🏥</div>
        <h2 class="text-xl font-bold text-[#4A3B32] group-hover:text-[#8C6D53] transition">院所調撥系統</h2>
        <p class="text-xs text-gray-500 mt-2 leading-relaxed">管理院所與水藥室之間的品項調撥需求與紀錄。</p>
        <span class="inline-block mt-4 text-xs font-bold text-[#8C6D53] group-hover:translate-x-1 transition-transform">進入系統 &rarr;</span>
      </a>

      <a href="Chinese-herbs.html" class="bg-white p-6 rounded-2xl shadow-sm hover:shadow-md border border-[#E2DAD0] hover:border-[#8C6D53] transition-all transform hover:-translate-y-1 block group">
        <div class="text-4xl mb-4">🌿</div>
        <h2 class="text-xl font-bold text-[#4A3B32] group-hover:text-[#8C6D53] transition">藥材調撥系統</h2>
        <p class="text-xs text-gray-500 mt-2 leading-relaxed">管理藥材調撥、需求與相關紀錄。</p>
        <span class="inline-block mt-4 text-xs font-bold text-[#8C6D53] group-hover:translate-x-1 transition-transform">進入系統 &rarr;</span>
      </a>

      <a id="borrowCard" href="borrow.html" class="borrow-card bg-white p-6 rounded-2xl shadow-sm hover:shadow-md border border-[#E2DAD0] hover:border-[#8C6D53] transition-all transform hover:-translate-y-1 block group">
        <span class="borrow-order-alert">
          <span class="borrow-alert-dot"></span>
          有待下訂
        </span>

        <div class="text-4xl mb-4">🤲</div>
        <h2 class="text-xl font-bold text-[#4A3B32] group-hover:text-[#8C6D53] transition">借用品項</h2>
        <p class="text-xs text-gray-500 mt-2 leading-relaxed">紀錄與南竹水藥室借用之糖果、牛皮袋，並能查詢歷史紀錄。</p>

        <div class="borrow-order-message">⚠️ 借用品項有待下訂，請點入查看</div>

        <span class="inline-block mt-4 text-xs font-bold text-[#8C6D53] group-hover:translate-x-1 transition-transform">進入系統 &rarr;</span>
      </a>

    </div>
  </main>

  <script>
    // 借用品項下訂提醒：主畫面直接向借用系統 GAS 抓資料。
    // 不依賴先進入 borrow.html，也不使用快取。
    const BORROW_GAS_URL = "https://script.google.com/macros/s/AKfycbwz3E-EO3dGsraL9NFGMU7sU13KaZCjrSNieWUWYEEGxYN9PiXSyaePES_qkJP0ENhzWQ/exec";

    const ITEM_BOX_LIMITS = {
      "梅餅": 30,
      "酸梅": 20,
      "梅粒": 40,
      "大牛皮紙袋": 25,
      "小牛皮紙袋": 50
    };

    const DEFAULT_BOX_QTY = 30;

    function applyBorrowOrderReminder(pendingCount) {
      const card = document.getElementById("borrowCard");
      if (!card) return;

      const hasPending = Number(pendingCount) > 0;
      card.classList.toggle("has-pending-order", hasPending);
    }

    function calculateBorrowPendingCount(logs) {
      const itemGroups = {};

      (Array.isArray(logs) ? logs : []).forEach(item => {
        if (!item || !item.name) return;

        const name = String(item.name).trim();
        if (!itemGroups[name]) itemGroups[name] = [];
        itemGroups[name].push(item);
      });

      let pendingCount = 0;

      Object.keys(itemGroups).forEach(name => {
        const records = itemGroups[name].sort((a, b) => {
          return new Date(a.date) - new Date(b.date);
        });

        const boxLimit = ITEM_BOX_LIMITS[name] || DEFAULT_BOX_QTY;

        let currentCum = 0;
        let reachedBoxes = 0;

        records.forEach(record => {
          const qty = parseFloat(record.qty) || 0;
          currentCum += qty;

          while (currentCum >= (reachedBoxes + 1) * boxLimit) {
            reachedBoxes++;

            const notifId = `order_${name}_box_${reachedBoxes}`;

            if (localStorage.getItem(notifId) !== "true") {
              pendingCount++;
            }
          }
        });
      });

      return pendingCount;
    }

    let borrowReminderLastFetch = 0;

    function refreshBorrowOrderReminder() {
      const now = Date.now();

      // 避免 DOMContentLoaded 與 pageshow 在同一瞬間重複抓取。
      if (now - borrowReminderLastFetch < 500) return;
      borrowReminderLastFetch = now;

      fetch(BORROW_GAS_URL, {
        method: "GET",
        cache: "no-store"
      })
      .then(response => {
        if (!response.ok) {
          throw new Error(`借用資料讀取失敗：HTTP ${response.status}`);
        }
        return response.json();
      })
      .then(logs => {
        const pendingCount = calculateBorrowPendingCount(logs);
        applyBorrowOrderReminder(pendingCount);
      })
      .catch(error => {
        console.error("借用品項下訂提醒讀取失敗：", error);
        // 抓不到資料時不改變畫面，不影響主畫面其他功能。
      });
    }

    // 一進主畫面就直接開始抓資料；不等待使用者點進借用品項。
    document.addEventListener("DOMContentLoaded", () => {
      refreshBorrowOrderReminder();
    });

    // 從 borrow.html 返回主畫面時，再重新抓一次最新狀態。
    window.addEventListener("pageshow", () => {
      refreshBorrowOrderReminder();
    });

    // 若同一個瀏覽器分頁中有其他頁面修改了下訂勾選狀態，也同步更新。
    window.addEventListener("storage", event => {
      if (event.key && event.key.startsWith("order_")) {
        refreshBorrowOrderReminder();
      }
    });
  </script>

</body>
</html>
